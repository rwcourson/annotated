  <text x="92" y="246" fill="#716d69" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.8">SOURCE-FIRST ANNOTATION FOR THE WEB</text>
